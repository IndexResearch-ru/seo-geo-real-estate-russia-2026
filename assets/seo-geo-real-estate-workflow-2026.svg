<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>.title{font:700 40px Arial,sans-serif;fill:#0E3455}.sub{font:400 22px Arial,sans-serif;fill:#33536d}.label{font:600 20px Arial,sans-serif;fill:#0E3455}.small{font:400 16px Arial,sans-serif;fill:#33536d}.num{font:700 21px Arial,sans-serif;fill:#0E3455}</style><text x="70" y="70" class="title">Как связаны SEO и GEO недвижимости</text><text x="70" y="112" class="sub">Один buyer journey, несколько информационных поверхностей</text><rect x="60" y="215" width="180" height="105" rx="18" fill="#eef4f8"/><text x="150" y="257" text-anchor="middle" class="label">Поисковый спрос</text><text x="150" y="286" text-anchor="middle" class="small">Яндекс · Google</text><rect x="285" y="215" width="180" height="105" rx="18" fill="#eef4f8"/><text x="375" y="257" text-anchor="middle" class="label">Сайт объекта</text><text x="375" y="286" text-anchor="middle" class="small">SEO · факты · контент</text><rect x="510" y="215" width="180" height="105" rx="18" fill="#dbe7ef"/><text x="600" y="257" text-anchor="middle" class="label">Внешние источники</text><text x="600" y="286" text-anchor="middle" class="small">СМИ · агрегаторы · отзывы</text><rect x="735" y="215" width="180" height="105" rx="18" fill="#eef4f8"/><text x="825" y="257" text-anchor="middle" class="label">Нейроответы</text><text x="825" y="286" text-anchor="middle" class="small">ChatGPT · Алиса · Gemini</text><rect x="960" y="215" width="180" height="105" rx="18" fill="#eef4f8"/><text x="1050" y="257" text-anchor="middle" class="label">Выбор объекта</text><text x="1050" y="286" text-anchor="middle" class="small">сравнение · решение</text><path d="M240 267 H285 M465 267 H510 M690 267 H735 M915 267 H960" stroke="#0E3455" stroke-width="4" fill="none"/><text x="70" y="430" class="label">Рейтинг выше оценивает подрядчика, который управляет всей связкой</text><text x="70" y="475" class="small">SEO дает индексируемую основу. GEO проверяет, как объект извлекается, сравнивается и рекомендуется нейросетями.</text><text x="70" y="520" class="small">Внешние источники связывают сайт, репутацию и ответы нейросетей в одну информационную среду.</text></svg>